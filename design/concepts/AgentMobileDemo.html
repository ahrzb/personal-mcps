  /* ---- mobile: three levels, one visible at a time ---- */

  #banner{padding:8px 12px 0}
  #banner:empty{padding:0}
  .banner{font-size:12px;flex-wrap:wrap}

  .rail,.listing,.details{display:none;width:100%;box-sizing:border-box;flex:1;min-height:0;border-right:0}

  .phone[data-level="3"] .details{display:flex}
  .panes.wide .details{display:none}
  .panes.wide .listing{width:100%}
  .rh{padding:10px 8px 4px}
  .ri{height:44px;font-size:15px;padding:0 10px;border-radius:10px}

  .note.hint{display:none}
  .toast{bottom:80px;width:340px;text-align:center;font-size:12px}

<script>
// ---------------------------------------------------------------- fixture
const APPS = {
  news: { name: "News MCP", kind: "tunneled", status: "online",
    roles: { reader: { tools: ["get_news", "search_.*"], prompts: ["digest_.*"] }, admin: { tools: ["admin_.*"] }, publisher: { tools: ["publish", "delete_feed"] } },
    tools: [["get_news","Latest items across all feeds",[["since","string","optional"]]],["search_feeds","Find feeds by name or URL",[["query","string","required"]]],["search_items","Search items across feeds",[["query","string","required"],["feed","string","optional"],["limit","integer","optional · defaults to 20"],["cookie","string","optional · redacted (config)"]]],["search_archive","Search the archive",[["query","string","required"]]],["admin_purge_cache","Drop cached items",[["scope","string","required"]]],["admin_reindex","Rebuild the search index",[]],["admin_export","Export everything as JSON",[]],["publish","Post an item to a feed",[["feed","string","required"],["title","string","required"]]],["delete_feed","Remove a feed and its items",[["feed","string","required"]]],["subscribe","Subscribe to a feed",[["url","string","required"]]],["unsubscribe","Unsubscribe from a feed",[["feed","string","required"]]]],
    prompts: [["digest_daily","Summarise the last 24 h"]],
    resources: [["news://feed/hn","text/plain"],["news://feed/lobsters","text/plain"],["news://config","application/json"]] },
  linear: { name: "Linear", kind: "proxied", status: "connected",
    roles: { reader: { tools: ["list_.*", "get_.*"] }, docs: { resources: ["linear://docs/.*"] } },
    tools: [["list_issues","Issues in a project",[]],["get_issue","One issue by id",[]],["list_projects","Projects in the workspace",[]],["create_issue","Create an issue",[]],["update_issue","Update an issue",[]],["delete_issue","Delete an issue",[]]],
    prompts: [],
    resources: [["linear://docs/roadmap","text/markdown"],["linear://docs/process","text/markdown"]] },
  home: { name: "Home automation", kind: "tunneled", status: "archived",
    roles: { control: { tools: ["set_.*", "toggle_.*"] } },
    tools: [["set_thermostat","Set a temperature",[]],["toggle_light","Toggle a light",[]],["status","Read every sensor",[]]], prompts: [], resources: [] },
  gh: { name: "GitHub", kind: "proxied", status: "connected",
    roles: { reader: { tools: ["list_.*", "get_.*"] } },
    tools: [["list_prs","Open pull requests",[]],["get_pr","One pull request",[]],["merge_pr","Merge a pull request",[]],["create_issue","Open an issue",[]]], prompts: [], resources: [] },
};
// saved grant sets: entries are role names or family/pattern
let SAVED = {
  news: { allow: ["reader", "tool/get_news", "resource/news://feed/*"], approval: ["admin", "tool/publish"] },
  linear: { allow: ["reader"], approval: [] },
  home: { allow: [], approval: ["control"] },
};
const UNGRANTED = () => Object.keys(APPS).filter((a) => !SAVED[a] && !(draft && draft.app === a));

// ---------------------------------------------------------------- matcher (§7: anchored, literal fast path, * aliases .*)
const LITERAL = /^[A-Za-z0-9._-]+$/;
function matches(pattern, name) {
  if (LITERAL.test(pattern)) return pattern === name;
  try { return new RegExp("^(?:" + pattern.replace(/(?<![.\]])\*/g, ".*") + ")$").test(name); } catch { return false; }
}
function parseEntry(e) {
  const m = e.match(/^(tool|prompt|resource)\/(.*)$/);
  return m ? { kind: "item", family: m[1] + "s", pattern: m[2] } : { kind: "role", role: e };
}
function patternsOf(app, entry, family) {

  const lh = document.getElementById("lh"), list = document.getElementById("list"), save = document.getElementById("save"), det = document.getElementById("details");
  save.innerHTML = "";
  const sel = (kind, id) => (picked && picked.kind === kind && picked.id === id ? " cur" : "");
  const outcomeBadge = (o) => o === "ok" ? `<span class="badge ok">ok</span>` : o === "approval required" ? `<span class="badge warn">approval required</span>` : `<span class="badge" style="background:#fef2f2;color:#b91c1c;border:1px solid #fecaca">${o}</span>`;

  if (view === "credentials") {
    lh.innerHTML = `<div class="row" style="justify-content:space-between"><div class="row" style="gap:6px"><span style="font-weight:600">Credentials</span><span class="cell">what claude presents to get in</span></div></div><div class="sum">Any of these carries the grants in the Apps list. A token expires on its date; a client stays in until revoked in Settings.</div>`;
    list.innerHTML = `<div class="gh"><span>Tokens · ${TOKENS.filter((t) => !t.revoked).length}</span><span style="text-transform:none;letter-spacing:0;display:flex;gap:6px;align-items:center">expires in <select style="font:inherit;font-size:11px;height:22px;border:1px solid #e4e4e7;border-radius:6px" onchange="expiresIn=this.value">${["30d", "90d", "1y", "never"].map((v) => `<option value="${v}"${v === expiresIn ? " selected" : ""}>${v === "90d" ? "90 d · default" : v === "1y" ? "1 year" : v === "30d" ? "30 d" : "never"}</option>`).join("")}</select><button class="mini" onclick="issueToken()">Issue token</button></span></div>` +
      TOKENS.filter((t) => !t.revoked).map((t) => `<div class="cr${sel("token", t.id)}${t.expired ? " dorm" : ""}" onclick="picked={kind:'token',id:'${t.id}'};render()"><div><span class="mono">${t.prefix}</span>${t.expired ? ` <span class="badge warn">expired</span>` : ""}${reveal && reveal.id === t.id ? ` <span class="badge ok" style="border-style:dashed">new</span>` : ""}<div class="d">created ${t.created} · expires ${t.expires}${t.days ? ` (${t.days} d)` : ""} · ${t.lastUsed ? "used " + t.lastUsed : "never used"}</div></div><div class="st" onclick="event.stopPropagation()">${confirmRevoke === t.id ? `<span class="cell" style="font-size:12px">${t.expired ? "It expired " + t.expires + "; removing it keeps its history." : "Calls with this key fail from now on."}</span><button class="mini" onclick="confirmRevoke=null;render()">Keep</button><button class="mini" style="color:#dc2626;border-color:#fecaca" onclick="revoke('${t.id}')">${t.expired ? "Remove" : "Revoke"}</button>` : `<button class="mini" onclick="confirmRevoke='${t.id}';render()">${t.expired ? "Remove" : "Revoke"}</button>`}</div></div>`).join("") +
      `<div class="gh"><span>Connected clients · ${CLIENTS.length}</span><span style="text-transform:none;letter-spacing:0">OAuth · managed in Settings</span></div>` +
      CLIENTS.map((c) => `<div class="cr${sel("client", c.id)}" onclick="picked={kind:'client',id:'${c.id}'};render()"><div><span>${c.name}</span> <span class="mono cell">${c.origin}</span><div class="d">consented ${c.consented} · used ${c.lastUsed}</div></div><div class="st"><span class="badge ok"><span class="dot"></span>active</span></div></div>`).join("") +
      `<div class="note" style="padding:12px 16px">One OAuth client signs in as this agent, so its calls carry these grants. Revoking lives with the other credentials in Settings → Connected clients.</div>`;
    if (picked && picked.kind === "token") {
      const t = TOKENS.find((t) => t.id === picked.id);
      det.innerHTML = `<div class="dh"><div class="row" style="gap:8px"><span class="mono" style="font-size:15px;font-weight:600">${t.prefix}</span><span class="badge">token</span>${t.expired ? `<span class="badge warn">expired</span>` : ""}</div><div class="cell" style="margin-top:2px">A bearer key an agent config pastes in. Resolved on every request; revocation is immediate.</div></div><div class="db">${reveal && reveal.id === t.id ? `<div class="sec" style="border-color:#bbf7d0;background:#f0fdf4"><div class="eyebrow" style="color:#15803d">Shown once — copy it now</div><div class="mono" style="font-size:12px;word-break:break-all">${reveal.key}</div><div class="row" style="gap:6px"><button class="mini" onclick="toast('copied');">Copy</button><span class="cell" style="font-size:11px">Any earlier key keeps working until you revoke it.</span></div></div>` : ""}<div class="sec"><div class="eyebrow">This key</div>${kv("Created", t.created)}${kv("Expires", t.expires + (t.days ? ` · ${t.days} d from issue` : " · no expiry"))}${kv("Last used", t.lastUsed || "never")}${kv("Carries", "every grant in the Apps list — a key is the agent, not a subset of it")}</div><div class="sec"><div class="eyebrow">Recent use</div>${t.lastUsed ? CALLS.slice(0, 3).map((c) => `<div class="kv"><div class="k">${c.when}</div><div><span class="mono">${c.app}</span> · <span class="mono">${c.tool}</span></div></div>`).join("") : "<span class='dim' style='font-size:12px'>no calls yet</span>"}</div><div class="row" style="gap:6px"><button class="mini" style="color:#dc2626;border-color:#fecaca" onclick="confirmRevoke='${t.id}';render()">${t.expired ? "Remove" : "Revoke"}</button>${t.expired ? `<span class="hint">the same revoke underneath — the row is kept as history, just no longer listed</span>` : ""}</div></div>`;
    } else if (picked && picked.kind === "client") {
      const c = CLIENTS.find((c) => c.id === picked.id);
      det.innerHTML = `<div class="dh"><div class="row" style="gap:8px"><span style="font-size:15px;font-weight:600">${c.name}</span><span class="badge">OAuth client</span></div><div class="cell" style="margin-top:2px">Signed in through the hub's consent screen and bound to claude.</div></div><div class="db"><div class="sec"><div class="eyebrow">This client</div>${kv("Redirect origin", `<span class="mono">${c.origin}</span>`)}${kv("Consented", c.consented)}${kv("Last used", c.lastUsed)}${kv("Registered", c.selfRegistered ? "self-registered (unverified)" : "by you, at consent")}${kv("Carries", "every grant in the Apps list, like a token")}</div><div class="note">Revoke lives in <a>Settings → Connected clients</a> — one place revokes (§19.6). Deleting the agent revokes it too.</div></div>`;
    } else {
      det.innerHTML = `<div class="dh"><div style="font-size:15px;font-weight:600">Credentials</div><div class="cell" style="margin-top:2px">Select a token or client for its details.</div></div><div class="db"><div class="sec"><div class="eyebrow">Summary</div>${kv("Tokens", `${TOKENS.filter((t) => !t.expired && !t.revoked).length} live · ${TOKENS.filter((t) => t.expired && !t.revoked).length} expired`)}${kv("Clients", `${CLIENTS.length} active`)}${kv("Default expiry", "90 days for agent tokens; override at issue")}</div></div>`;
    }
    return;
  }

  if (view === "activity") {
    const pending = APPROVALS.filter((a) => a.status === "pending");
    lh.innerHTML = `<div class="row" style="justify-content:space-between"><div class="row" style="gap:6px"><span style="font-weight:600">Activity</span><span class="cell">the last 7 days, the retention window</span></div><a class="cell">full trail · /audit?principal=agent:claude</a></div><div class="sum">${CALLS.length} calls · ${CALLS.filter((c) => c.outcome === "ok").length} ok · ${CALLS.filter((c) => c.outcome === "not permitted").length} denied · ${pending.length} awaiting approval</div>`;
    list.innerHTML = `<div class="gh"><span>Awaiting approval · ${pending.length}</span><span style="text-transform:none;letter-spacing:0">each expires an hour after it was asked</span></div>` +
      (pending.length ? pending.map((a) => `<div class="cr${sel("approval", a.id)}" onclick="picked={kind:'approval',id:'${a.id}'};render()"><div><span class="mono cell">${a.app}</span> <span class="mono">${a.tool}</span><div class="d mono">${esc(JSON.stringify(a.args))}</div></div><div class="st" onclick="event.stopPropagation()"><span class="cell" style="font-size:11px">${a.age}</span><button class="mini" onclick="decide('${a.id}','rejected')">Reject</button><button class="mini" style="background:#18181b;color:#fafafa;border-color:#18181b" onclick="decide('${a.id}','approved')">Approve</button></div></div>`).join("") : `<div class="note" style="padding:6px 16px">Nothing waiting.</div>`) +
      APPROVALS.filter((a) => a.status !== "pending").map((a) => `<div class="cr dorm"><div><span class="mono cell">${a.app}</span> <span class="mono">${a.tool}</span><div class="d">${a.status} just now</div></div><div class="st"><span class="badge">${a.status}</span></div></div>`).join("") +
      `<div class="gh"><span>Recent calls · ${CALLS.length}</span><span style="text-transform:none;letter-spacing:0">newest first</span></div>` +
      CALLS.map((c) => `<div class="cr${sel("call", c.id)}" onclick="picked={kind:'call',id:'${c.id}'};render()"><div><span class="mono cell">${c.app}</span> <span class="mono">${c.tool}</span><div class="d">${c.when} · ${c.ms} ms</div></div><div class="st">${outcomeBadge(c.outcome)}</div></div>`).join("");
    if (picked && picked.kind === "approval") {
      const a = APPROVALS.find((a) => a.id === picked.id);
      det.innerHTML = `<div class="dh"><div class="row" style="gap:8px"><span class="mono" style="font-size:15px;font-weight:600">${a.tool}</span><span class="badge warn">${a.status}</span></div><div class="cell" style="margin-top:2px">claude wants to call this on <span class="mono">${a.app}</span> · asked ${a.age}${a.status === "pending" ? ` · expires in ${a.expires}` : ""}</div></div><div class="db"><div class="sec"><div class="eyebrow">Arguments · post-redaction</div><div class="mono" style="font-size:12px;white-space:pre">${esc(JSON.stringify(a.args, null, 2))}</div></div><div class="sec"><div class="eyebrow">Why it waits</div>${kv("Grant", `<span class="mono">admin</span> is in Ask first on <span class="mono">${a.app}</span>`)}${kv("Then", "the agent retries the identical call and it runs once; a different call asks again")}</div>${a.status === "pending" ? `<div class="row" style="gap:6px"><button class="mini" onclick="decide('${a.id}','rejected')">Reject</button><button class="mini" style="background:#18181b;color:#fafafa;border-color:#18181b" onclick="decide('${a.id}','approved')">Approve</button></div>` : ""}</div>`;
    } else if (picked && picked.kind === "call") {
      const c = CALLS.find((c) => c.id === picked.id);
      const why = c.outcome === "ok" ? null : "Refused before the call was made, so there are no bodies to show.";
      det.innerHTML = `<div class="dh"><div class="row" style="gap:8px"><span class="mono" style="font-size:15px;font-weight:600">${c.tool}</span>${outcomeBadge(c.outcome)}</div><div class="cell" style="margin-top:2px"><span class="mono">${c.app}</span> · ${c.when} · ${c.ms} ms · client ${c.client}</div></div><div class="db">${why ? `<div class="sec"><div class="cell">${why}</div></div>` : `<div class="sec"><div class="eyebrow">Arguments</div><div class="mono" style="font-size:12px;white-space:pre">${esc(JSON.stringify(c.args, null, 2))}</div></div><div class="sec"><div class="eyebrow">Result · structuredContent</div><div class="mono" style="font-size:12px;white-space:pre">${esc(JSON.stringify(c.result, null, 2))}</div></div>`}<div class="note">The same row the audit page shows, with its keys clickable there to mask a path from evidence. <a>Open in the audit trail</a>.</div></div>`;
    } else {
      det.innerHTML = `<div class="dh"><div style="font-size:15px;font-weight:600">Activity</div><div class="cell" style="margin-top:2px">Select a request or a call for its details.</div></div><div class="db"><div class="sec"><div class="eyebrow">7 days</div>${kv("Calls", `${CALLS.length} · ${CALLS.filter((c) => c.outcome === "ok").length} ok`)}${kv("Denied", `${CALLS.filter((c) => c.outcome === "not permitted").length} — the agent probing past its grants`)}${kv("Gated", `${CALLS.filter((c) => c.outcome === "approval required").length}`)}${kv("Most called", "<span class='mono'>news</span> · <span class='mono'>search_items</span>")}</div></div>`;
    }
    return;
  }

  document.querySelector(".panes").classList.toggle("wide", view === "grant");
  if (view === "grant") {
    const apps = UNGRANTED();
    lh.innerHTML = `<div class="row" style="justify-content:space-between"><div class="row" style="gap:6px"><span style="font-weight:600">Grant another app</span><span class="cell">apps claude holds nothing on</span></div><input class="filter" placeholder="search apps and endpoints…" value="${esc(grantQuery)}" oninput="grantQuery=this.value;render();document.querySelector('.filter').focus()"></div><div class="sum">What each app does; open it to see every endpoint and which roles grant it. Grant opens the app with nothing granted yet.</div>`;
    const rolesFor = (app, fam, name) => Object.keys(APPS[app].roles).filter((r) => (APPS[app].roles[r][fam] || []).some((pt) => matches(pt, name)));
    const info = (desc, args) => `<span class="info">i<span class="tip">${esc(desc)}${args && args.length ? `<div class="a" style="margin-top:4px">args: ${args.map(([n, t, d]) => `${n} <span style="opacity:.7">${t}${d && d.startsWith("required") ? "" : "?"}</span>`).join(", ")}</div>` : ""}</span></span>`;
    const ep = (app, fam, [name, desc, args]) => {
      const rs = rolesFor(app, fam, name);
      return `<div class="ep"><div><span class="fam">${fam.slice(0, -1)}</span><span class="mono">${esc(name)}</span>${info(desc || (fam === "resources" ? "resource · " + (desc || "") : ""), args)}</div><div class="roles">${rs.length ? rs.map((r) => `<span class="badge mono">${r}</span>`).join("") : `<span class="dim" style="font-size:11px">only via <span class="mono">all</span> or by name</span>`}</div></div>`;
    };
    const gq = grantQuery.trim().toLowerCase();
    const epHit = ([name, desc]) => !gq || name.toLowerCase().includes(gq) || (desc || "").toLowerCase().includes(gq);
    const appHit = (a) => !gq || a.includes(gq) || APPS[a].name.toLowerCase().includes(gq) || (APP_DESC[a] || "").toLowerCase().includes(gq) || [...APPS[a].tools, ...APPS[a].prompts, ...APPS[a].resources].some(epHit);
    const card = (a) => {
      const A = APPS[a];
      const n = A.tools.length + A.prompts.length + A.resources.length;
      const epMatch = gq && [...A.tools, ...A.prompts, ...A.resources].some(epHit);
      const isOpen = openApps.has(a) || epMatch;
      const counts = [`${A.tools.length} tools`, A.prompts.length ? `${A.prompts.length} prompts` : null, A.resources.length ? `${A.resources.length} resources` : null].filter(Boolean).join(" · ");
      return `<div class="appcard"><div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <div class="row" style="gap:8px"><span style="font-weight:600">${A.name}</span><span class="mono cell">${a}</span><span class="badge">${A.kind}</span><span class="badge ok"><span class="dot"></span>${A.status}</span></div>
        <div style="font-size:13px">${APP_DESC[a] || ""}</div>
        <div class="cell" style="font-size:12px">${counts} · roles ${Object.keys(A.roles).map((r) => `<span class="mono">${r}</span>`).join(", ") || "none"} <button class="tog" onclick="openApps.has('${a}') ? openApps.delete('${a}') : openApps.add('${a}'); render()">${isOpen ? "hide" : "show all " + n}</button></div>
        ${isOpen ? `<div class="eps">${A.tools.filter(epHit).map((t) => ep(a, "tools", t)).join("")}${A.prompts.filter(epHit).map((t) => ep(a, "prompts", t)).join("")}${A.resources.filter(epHit).map((t) => ep(a, "resources", t)).join("")}</div>` : ""}
      </div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><button class="btn primary" onclick="startGrant('${a}')">Grant</button></div></div>`;
    };
    list.innerHTML = apps.length
      ? (apps.filter(appHit).length ? `<div class="gh"><span>Apps · ${apps.filter(appHit).length}${gq ? " of " + apps.length : ""}</span><span style="text-transform:none;letter-spacing:0">active, not archived · nothing is written until you save</span></div>` + apps.filter(appHit).map(card).join("") : `<div class="note" style="padding:16px">No app or endpoint matches “${esc(grantQuery)}”.</div>`)
      : `<div class="note" style="padding:16px">claude already holds a grant on every active app. Archived apps are not listed; unarchive one to grant it.</div>`;
    return;
  }

  // danger
  lh.innerHTML = `<div class="row" style="gap:6px"><span style="font-weight:600">Danger zone</span></div>`;
  list.innerHTML = `<div style="padding:16px"><div class="sec" style="border-color:#fecaca"><div style="font-weight:500">Delete agent</div><div class="cell">Deleting an agent deletes its tokens, revokes its clients and removes its grants everywhere. This cannot be undone.</div><div class="row" style="gap:6px;padding-top:6px"><button class="mini" style="color:#dc2626;border-color:#fecaca" onclick="toast('agent_delete claude — not in the demo')">Delete claude</button></div></div></div>`;
  det.innerHTML = `<div class="dh"><div style="font-size:15px;font-weight:600">What deletion removes</div></div><div class="db"><div class="sec">${kv("Grants", `${Object.keys(SAVED).length} apps`)}${kv("Tokens", `${TOKENS.filter((t) => !t.revoked).length}`)}${kv("Clients", `${CLIENTS.length} — the binding cascades`)}${kv("History", "kept — audit rows name the principal, not the row")}</div></div>`;
}

function renderDetails(set) {
  const A = APPS[current];
  if (!selected) {
    const r = reach(current, set);
    return `<div class="dh"><div class="row" style="gap:8px"><span style="font-size:15px;font-weight:600">${A.name}</span><span class="badge">${A.kind}</span></div><div class="cell" style="margin-top:2px">Select a role, tool, prompt or resource on the left for its details.</div></div>
      <div class="db"><div class="sec"><div class="eyebrow">Catalog</div>${kv("Tools", `${A.tools.length} · ${r.tools.reached} reached by claude`)}${kv("Prompts", `${A.prompts.length} · ${r.prompts.reached} reached`)}${kv("Resources", `${A.resources.length} · ${r.resources.reached} reached`)}${kv("Roles", Object.keys(A.roles).join(", ") || "none declared")}</div>
      <div class="sec"><div class="eyebrow">Grant set for claude</div>${kv("Allowed", set.allow.map((e) => `<span class="mono">${esc(e)}</span>`).join(", ") || "<span class='dim'>nothing</span>")}${kv("Ask first", set.approval.map((e) => `<span class="mono">${esc(e)}</span>`).join(", ") || "<span class='dim'>nothing</span>")}</div></div>`;
  }
  const { kind, name } = selected;
  if (kind === "role") {
    const role = name, mode = set.allow.includes(role) ? "allow" : set.approval.includes(role) ? "approval" : "";
    const fams = role === "all" ? { tools: [".*"], prompts: [".*"], resources: [".*"] } : A.roles[role];
    const matched = ["tools", "prompts", "resources"].map((f) => [f, A[f].filter(([n]) => (fams[f] || []).some((p) => matches(p, n))).map(([n]) => n)]);
    return `<div class="dh"><div class="row" style="gap:8px"><span class="mono" style="font-size:15px;font-weight:600">${role}</span><span class="badge">role</span></div><div class="cell" style="margin-top:2px">${role === "all" ? "Built in: every family, present and future." : `Declared by ${A.name}${A.kind === "tunneled" ? " at connect" : " in config"}.`}</div></div>
      <div class="db"><div class="sec"><div class="eyebrow">For claude</div>${kv("Standing", mode ? `<span class="badge ${mode === "allow" ? "ok" : "warn"}">${mode === "allow" ? chk + " in Allowed" : "in Ask first"}</span>` : "<span class='dim'>not granted</span>")}<div class="row" style="gap:6px"><span class="seg"><button class="${mode === "" ? "on" : ""}" onclick="setEntry('${role}',null)">none</button><button class="${mode === "approval" ? "on warn" : ""}" onclick="setEntry('${role}','approval')">ask</button><button class="${mode === "allow" ? "on" : ""}" onclick="setEntry('${role}','allow')">allow</button></span></div></div>
      <div class="sec"><div class="eyebrow">Patterns</div>${Object.entries(fams).map(([f, p]) => kv(f, `<span class="mono">${esc(p.join(", "))}</span>`)).join("")}</div>
      <div class="sec"><div class="eyebrow">Matches today</div>${matched.map(([f, ns]) => kv(f, ns.length ? ns.map((n) => `<span class="mono">${esc(n)}</span>`).join(", ") : "<span class='dim'>none</span>")).join("")}</div>
      <div class="note">A role widens when the app widens it. To keep a single item regardless, add it directly from its row.</div></div>`;
  }
  if (kind === "pattern") {
    const mode = set.allow.includes(name) ? "allow" : "approval";
    const p = parseEntry(name);
    const ns = A[p.family].filter(([n]) => matches(p.pattern, n)).map(([n]) => n);
    return `<div class="dh"><div class="row" style="gap:8px"><span class="mono" style="font-size:15px;font-weight:600">${esc(name)}</span><span class="badge">pattern</span></div><div class="cell" style="margin-top:2px">An entry that is not one item: anchored, <span class="mono">*</span> aliases <span class="mono">.*</span>.</div></div>
      <div class="db"><div class="sec"><div class="eyebrow">For claude</div>${kv("Standing", `<span class="badge ${mode === "allow" ? "ok" : "warn"}">${mode === "allow" ? chk + " in Allowed" : "in Ask first"}</span>`)}<div class="row" style="gap:6px"><button class="mini" onclick="setEntry('${esc(name)}','${mode === "allow" ? "approval" : "allow"}')">Move to ${mode === "allow" ? "Ask first" : "Allowed"}</button><button class="mini" onclick="setEntry('${esc(name)}',null);selected=null;render()">Remove</button></div></div>
      <div class="sec"><div class="eyebrow">Matches today · ${ns.length}</div>${ns.length ? ns.map((n) => `<div class="mono" style="font-size:12px">${esc(n)}</div>`).join("") : "<span class='dim' style='font-size:12px'>nothing — kept, dormant</span>"}</div></div>`;
  }
  const family = famOf[kind];
  const item = A[family].find(([n]) => n === name);
  const s = standing(current, set, family, name);
  const direct = `${kind}/${name}`;
  const viaRoles = s.via.filter((e) => e !== direct);
  const stand = s.mode === "allow" ? `<span class="badge ok">${chk} allowed${viaRoles.length ? " · via " + viaRoles.join(", ") : " · direct"}</span>` : s.mode === "approval" ? `<span class="badge warn">ask${viaRoles.length ? " · via " + viaRoles.join(", ") : " · direct"}</span>` : `<span class="dim">not reachable</span>`;
  const approvalNote = s.mode === "allow" && viaRoles.length ? `Not asked — allow wins over any ask entry, so adding one here would not gate it while <span class="mono">${viaRoles.join(", ")}</span> allows it.` : s.mode === "approval" ? "Asked — each call waits for you." : s.mode === "allow" ? "Not asked." : "—";
  const args = kind === "tool" ? `<div class="sec"><div class="eyebrow">Arguments</div>${item[2].length ? item[2].map(([n, t, d]) => `<div class="arg"><div class="mono">${n}</div><div class="muted">${t}</div><div>${d.includes("redacted") ? d.replace("redacted (config)", `<span class="badge warn" style="height:18px">redacted · config</span>`) : d}</div></div>`).join("") : "<span class='dim' style='font-size:12px'>none</span>"}</div>` : "";
  const hub = kind === "tool" ? `<div class="sec"><div class="eyebrow">What only the hub knows</div>${kv("Called as", `<span class="mono">${current}_${esc(name)}</span> on the aggregated endpoint`)}${kv("Reachable by", `<span class="mono">claude</span>${s.mode ? "" : " — not with this set"}${current === "news" ? ", <span class='mono'>cron</span> · via reader" : ""}`)}${kv("Redaction", name === "search_items" ? "arguments <span class='mono'>cookie</span> (config)" : "none")}</div>` : kind === "resource" ? `<div class="sec"><div class="eyebrow">Resource</div>${kv("URI", `<span class="mono">${esc(name)}</span>`)}${kv("Type", item[1])}${kv("Served on", `the scoped endpoint only — <span class="mono">/ahrzb/mcp/${current}</span>`)}</div>` : "";
  return `<div class="dh"><div class="row" style="gap:8px"><span class="mono" style="font-size:15px;font-weight:600">${esc(name)}</span><span class="badge">${kind}</span></div><div class="cell" style="margin-top:2px">${esc(item[1])}</div></div>
    <div class="db"><div class="sec"><div class="eyebrow">For claude</div>${kv("Standing", stand)}${kv("Approval", approvalNote)}${kv("Last called", s.mode ? "2 h ago · 31 calls in 7 d · <a>see them</a>" : "<span class='dim'>never — not reachable</span>")}<div class="row" style="gap:8px;padding-top:2px">${itemSeg(direct, standing(current, { allow: set.allow.filter((e) => e !== direct), approval: set.approval.filter((e) => e !== direct) }, family, name), viaRoles)}<span class="hint">solid: set on this item · hollow: implied by a role · a direct entry survives the app changing what a role matches</span></div></div>${args}${hub}</div>`;
}
const kv = (k, v) => `<div class="kv"><div class="k">${k}</div><div>${v}</div></div>`;
render();

// ---- mobile levels -------------------------------------------------------------
let level = 1;
const phone = document.querySelector(".phone");
const desktopRender = render;
render = function () {
  desktopRender();
  phone.dataset.level = String(level);
  // level 1 is the agent itself: the crumb stops at the agent, the levels below are the navigation
  document.getElementById("crumb").innerHTML = '<a>Agents</a><span class="dim">/</span><span class="mono">claude</span>';
  const titles = { credentials: "Credentials", activity: "Activity", grant: "Grant another app", danger: "Danger zone" };
  const l2 = view === "app" ? APPS[current].name : titles[view];
  let l3 = "";
  if (view === "app" && selected) l3 = selected.name;
  else if (picked) l3 = picked.kind === "token" ? TOKENS.find((t) => t.id === picked.id).prefix : picked.kind === "client" ? CLIENTS.find((c) => c.id === picked.id).name : picked.kind === "approval" ? APPROVALS.find((a) => a.id === picked.id).tool : CALLS.find((c) => c.id === picked.id).tool;
  else l3 = l2;
  const dot = draft && isDirty() ? `<span title="unsaved" style="color:#2563eb;margin-left:4px">●</span>` : "";
  document.getElementById("mh").innerHTML = level === 2
    ? `<button class="back" onclick="up()">‹ claude</button><span class="mt">${esc(l2)}${dot}</span><span class="sp cell" style="font-size:11px">${view === "app" && dirty2() ? changeCount() + " unsaved" : ""}</span>`
    : `<button class="back" onclick="up()">‹ ${esc(l2)}</button><span class="mt mono">${esc(l3)}</span><span class="sp"></span>`;
};
function dirty2() { return draft && isDirty(); }
function up() { if (level === 3) { level = 2; } else if (level === 2) { level = 1; } render(); }
// a rail tap opens the listing; a row tap (outside its control) opens the details
document.getElementById("rail").addEventListener("click", (e) => { if (e.target.closest(".ri")) { level = 2; render(); } });
document.getElementById("list").addEventListener("click", (e) => {
  if (e.target.closest(".st") || e.target.closest("button") || e.target.closest("a") || e.target.closest("input") || e.target.closest("select")) return;
  if (e.target.closest(".cr") && !e.target.closest(".appcard")) { level = 3; render(); }
});
// the wide grant step has no details level: a Grant button lands on the app's listing
const desktopStartGrant = startGrant;
startGrant = function (app) { level = 2; desktopStartGrant(app); };
render();
</script>
</body>
</html>
