# Three importers. `cli` and `clients/js` are the two published packages; `web` is the browser
# client (§17) — unpublished, but a manifest of its own for the same reason, because its
# dependency set (React, TanStack, Vite, Tailwind) is one no other part of the repo may import
# and the root is where a mirrored declaration would drift. Before this key existed neither
# published manifest was an importer: the lockfile carried only the root, which meant each
# published manifest's dependencies were mirrored at the root to make anything resolve — two
# declarations of one dependency set, drifting, with npm resolving from the package and local
# `pnpm pmcp` resolving from the root (§22.7).
#
# `server/` gets no manifest on purpose: Wrangler builds it from the root, so a manifest there
# would be a third declaration with no consumer. `clients/py` and `clients/go` are not npm at all.
packages:
  - cli
  - web
  - clients/js
allowBuilds:
  esbuild: true # bundler used by wrangler; postinstall places its platform binary
  workerd: true # the Workers runtime itself — its postinstall downloads the binary wrangler dev runs
minimumReleaseAgeExclude:
  - '@sentry/cloudflare@10.71.0'
  - '@sentry/core@10.71.0'
  - '@sentry/server-utils@10.71.0'
